[env:esp32-s3-devkitm-1]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino

; Mémoire exacte ESP32-S3-WROOM-1-N4 (4MB DIO, sans PSRAM)
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = default.csv
board_upload.flash_size = 4MB
board_build.arduino.memory_type = dio_qspi

; Supprime toute trace de PSRAM si définie par la board
build_unflags =
    -DBOARD_HAS_PSRAM

; Active uniquement l'USB CDC natif (IO19/IO20)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps =
    bblanchon/ArduinoJson@^7.0.0

; Application complète (exclut le point d'entrée de l'outil de calibration)
build_src_filter =
    +<*>
    -<main_calib.cpp>

[env:calib]
; Outil de calibration/collecte de données autonome (voir src/calib_tool.cpp)
extends = env:esp32-s3-devkitm-1
build_src_filter =
    +<*>
    -<main_app.cpp>
    -<wifi_manager.cpp>
    -<ntp_time.cpp>
    -<api_client.cpp>
    -<json_filter.cpp>
    -<task_core0_network.cpp>
    -<task_core1_ui.cpp>
    -<mode_*.cpp>